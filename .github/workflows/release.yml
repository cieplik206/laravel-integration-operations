name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated SemVer tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer tag such as v0.2.0." >&2
            exit 1
          fi

          git ls-files --error-unmatch .github/release-signers
          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          git config --local gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-signers"
          git verify-tag "$RELEASE_TAG"

          TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git verify-commit "$TAG_COMMIT"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            --fail-on-no-commits
